name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @chai/db test
      - run: pnpm --filter @chai/agent-bridge test
      - run: pnpm --filter @chai/connectors-whatsapp test
      - run: pnpm --filter @chai/ai-prompts test
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: pnpm test:migrations
      - run: pnpm verify:data-paths
